name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Verify APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          R=$($BT/apksigner verify --verbose --print-certs $APK 2>&1 | tr '\n' ' ')
          echo "::notice title=apksigner::$R"
          B=$($BT/aapt2 dump badging $APK 2>&1 | grep -E "^package|sdkVersion|targetSdk|uses-permission|launchable" | tr '\n' ' ')
          echo "::notice title=badging::$B"
      - name: Build debug APK (fallback signature)
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hesabaty.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk hesabaty-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: تطبيق الأندرويد
          body: ملف تثبيت دفتر حساباتي للأندرويد. بيتحدّث تلقائيًا مع كل تغيير في مجلد android.
          files: |
            hesabaty.apk
            hesabaty-debug.apk
