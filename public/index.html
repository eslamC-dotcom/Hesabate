<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر حساباتي</title>
<meta name="theme-color" content="#0F5C57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حساباتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: ledger-book feel. Single column, bottom tab bar, centered "+" button, bottom sheets for every action. */
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--surface2:#E8EEEB;--fg:#14211F;--muted:#586A66;--line:#D3DDD9;
  --accent:#0F5C57;--accent-fg:#FFFFFF;--out:#B3402F;--in:#1B7A4B;--debt:#8F6200;--chip:#E2EAE7;--shadow:rgba(20,33,31,.14);
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--f-disp:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1413;--surface:#152120;--surface2:#1B2B29;--fg:#E6EFEC;--muted:#9AAEA9;--line:#263836;
  --accent:#4FC0B6;--accent-fg:#06211F;--out:#F08A78;--in:#6FD39A;--debt:#E6B34A;--chip:#1E2F2D;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1413;--surface:#152120;--surface2:#1B2B29;--fg:#E6EFEC;--muted:#9AAEA9;--line:#263836;
  --accent:#4FC0B6;--accent-fg:#06211F;--out:#F08A78;--in:#6FD39A;--debt:#E6B34A;--chip:#1E2F2D;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
header.top{display:flex;align-items:baseline;justify-content:space-between;padding-block:18px 8px}
header.top h1{font-family:var(--f-disp);font-size:24px;margin:0;font-weight:700;letter-spacing:.2px}
header.top .date{color:var(--muted);font-size:13px}
.banner{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-block:6px}
.hero{background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:18px 18px 14px;margin-block:8px 14px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-family:var(--f-body);font-weight:700;font-size:38px;line-height:1.15;margin-block:2px 10px}
.hero .big small{font-size:16px;font-weight:500;opacity:.85;margin-inline-start:6px}
.hero .sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.hero .sub b{display:block;font-size:18px;font-weight:600}
.hero .sub span{font-size:12px;opacity:.85}
.sec{display:flex;align-items:center;justify-content:space-between;margin-block:20px 8px}
.sec h2{font-size:15px;margin:0;font-weight:600;color:var(--muted)}
.link{color:var(--accent);font-size:13px;font-weight:600;padding:4px 2px}
.accs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:2px;min-width:0}
.acc .nm{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);min-width:0}
.acc .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.acc .bal{font-size:20px;font-weight:600}
.acc .bal.neg{color:var(--out)}
.acc.add{align-items:center;justify-content:center;color:var(--accent);border-style:dashed;font-weight:600;min-height:72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cat{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;font-size:13px;padding-block:5px}
.cat .track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;display:flex}
.cat .track i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);text-align:start;width:100%}
.row:last-child{border-bottom:0}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;white-space:nowrap}
.amt.out{color:var(--out)}.amt.in{color:var(--in)}.amt.debt{color:var(--debt)}.amt.flat{color:var(--fg)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);margin-inline-start:6px;vertical-align:1px}
.pill.once{background:color-mix(in srgb,var(--debt) 18%,transparent);color:var(--debt)}
.day{font-size:12px;color:var(--muted);margin-block:14px 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:99px;padding:7px 13px;font-size:14px;border:1.5px solid transparent;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.chip.sm{padding:4px 10px;font-size:12.5px}
.scroll-x{overflow-x:auto;display:flex;gap:8px;padding-bottom:4px}
.scroll-x .chip{flex:none}
.field{display:flex;flex-direction:column;gap:5px;margin-block:12px}
.field>label,.lbl2{font-size:12.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],select,textarea{
  width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
textarea{min-height:150px;resize:vertical;line-height:1.6}
.amount-in{font-size:34px!important;font-weight:700;text-align:center;border-radius:14px!important;padding-block:12px!important;font-variant-numeric:tabular-nums}
.btn{border-radius:12px;padding:12px 16px;font-weight:600;background:var(--chip);flex:1}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.nav{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:stretch;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:20}
.nav .in{max-width:640px;margin-inline:auto;display:flex;width:100%;align-items:center}
.nav .tab{flex:1;padding:8px 2px;font-size:12px;color:var(--muted);font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .tab.on{color:var(--accent);font-weight:700}
.fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px var(--shadow);flex:none;margin-inline:6px}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.backdrop{position:fixed;inset:0;background:rgba(5,12,11,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--f-disp);font-size:20px;margin:4px 0 6px}
.toast{position:fixed;inset:auto 0 calc(92px + env(safe-area-inset-bottom,0px)) 0;display:flex;justify-content:center;z-index:60;pointer-events:none;padding-inline:16px}
.toast>div{pointer-events:auto;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:100%;box-shadow:0 6px 18px var(--shadow)}
.toast button{color:var(--bg);font-weight:700;text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.sms{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-block:10px}
.sms .src{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:6px 8px;margin-block:6px;max-height:64px;overflow:hidden;direction:auto}
.sms .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.warn{color:var(--debt);font-size:12.5px}
.ok{color:var(--in);font-size:12.5px}
.kv{display:flex;justify-content:space-between;gap:10px;padding-block:6px;border-bottom:1px dashed var(--line);font-size:14px}
.kv span:first-child{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg .chip{text-align:center;padding:8px 4px;font-size:13.5px;white-space:normal;line-height:1.25}
@media (max-width:360px){.hero .big{font-size:32px}.cat{grid-template-columns:80px 1fr auto}}

html{color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px))}
.gate[hidden]{display:none}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;width:100%;max-width:420px}
.gcard h2{font-family:var(--f-disp);font-size:24px;margin:0 0 6px}
.gcard p{color:var(--muted);font-size:14px;margin:0 0 12px}
.nav .tab{position:relative}.bdg{position:absolute;top:0;left:calc(50% + 2px);min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}.bdg[hidden]{display:none}.toast{inset:calc(env(safe-area-inset-top,0px) + 12px) 0 auto 0}.shead{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px}.sbtn{padding:8px 14px;border-radius:10px;background:var(--chip);font-weight:600;font-size:14px;min-height:40px}.qa .btn{font-size:14px}.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}.qa .btn{padding:14px 10px}.flowsum,.flow2{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;margin-block:12px}
.fbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.fbox small,.fbox .lbl2{font-size:11.5px;color:var(--muted);font-weight:600}
.fbox b{font-size:15px;overflow:hidden;text-overflow:ellipsis}
.fbox.to{border-color:var(--in)}.fbox.from{border-color:var(--out)}
.fbox select{width:100%;min-height:36px;font-size:14px}
.far{align-self:center;font-size:20px;color:var(--muted)}
.tip{display:block;width:100%;text-align:start;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-block:8px}
.smsc .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.smsc .amtb{font-size:20px;font-weight:700}
.dirb{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;border:1.5px solid}
.dirb.in{color:var(--in);border-color:var(--in)}.dirb.out{color:var(--out);border-color:var(--out)}
.smsc .smeta{font-size:12.5px;color:var(--muted);margin-block:4px 8px}
.smsc details{margin-top:8px;font-size:12.5px;color:var(--muted)}
.smsc details .src{max-height:none;margin-top:6px}
.sgap{margin-top:10px}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header class="top"><h1>دفتر حساباتي</h1><span class="date" id="today"></span></header>
  <div id="banner"></div>
  <main id="view"><div class="empty">ثواني، بحمّل حساباتك…</div></main>
  <nav class="nav" aria-label="التنقل"><div class="in">
    <button class="tab on" data-act="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
    <button class="tab" data-act="tab" data-tab="log"><svg viewBox="0 0 24 24"><path d="M5 4h14M5 9h14M5 14h14M5 19h9"/></svg>السجل</button>
    <button class="fab" data-act="newTx" aria-label="سجّل حركة"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-act="tab" data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.200 6 5.500"/><path d="M16 5.2a3.200 3.200 0 0 1 0 6M18 14.800c1.800.700 3 2.400 3 5.200"/></svg>الناس</button>
    <button class="tab" data-act="tab" data-tab="sms"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.500h8M8 12.500h5"/></svg>رسائل<span class="bdg" id="smsBdg" hidden></span></button>
    <button class="tab" data-act="tab" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.400"/><circle cx="12" cy="12" r="1.400"/><circle cx="19" cy="12" r="1.400"/></svg>المزيد</button>
  </div></nav>
  <div id="sheetRoot"></div>
  <div class="gate" id="gate" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
